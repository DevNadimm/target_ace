name: target_ace
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  google_fonts: ^8.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  hugeicons: ^1.1.5
  awesome_snackbar_content: ^0.1.8
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.3
  device_preview: ^1.3.1
  fl_chart: ^1.1.1
  connectivity_plus: ^7.0.0
  flutter_launcher_icons: ^0.14.4
  modal_bottom_sheet: ^3.0.0
  dio: ^5.9.1
  location: ^8.0.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  network_info_plus: ^7.0.0
  logger: ^2.6.2
  get_it: ^9.2.1
  googleapis_auth: ^2.3.1
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.9.0
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  dotted_border: ^3.1.0
  url_launcher: ^6.3.2
  encrypt: ^5.0.3
  pin_code_fields: ^8.0.1
  pdf: ^3.11.3
  printing: ^5.14.3
  path_provider: ^2.1.5
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.8.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  lottie: ^3.3.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/icons/
    - assets/images/flags/
    - assets/images/illustrations/
    - assets/icons/
    - assets/logos/
    - assets/anim/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/logos/app_logo.png"
  adaptive_icon_background: "#072652"